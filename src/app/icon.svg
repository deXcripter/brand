<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="dx-gradient" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="60%" stop-color="#0F8B8D"/>
      <stop offset="100%" stop-color="#0b5e60"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background terminal box element -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#11161A" stroke="url(#dx-gradient)" stroke-width="1.5" />
  
  <!-- Outer glowing path of the X element -->
  <path d="M9 9 L23 23 M23 9 L9 23" stroke="url(#dx-gradient)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Terminal cursor block at the bottom right of the X -->
  <rect x="20" y="20" width="5" height="5" fill="#2DD4BF" />
</svg>
